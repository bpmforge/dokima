# Shipwright nightly E2E — docs/TESTING.md §7 (Playwright over the Canvas,
# fake-model gateway only). Green-skips until `pnpm e2e` exists (lands with
# W4 — apps/web + the fake-model gateway); never calls a real provider/forge.
name: Nightly E2E

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (fake-model gateway, TESTING.md §7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.11.0'
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Run pnpm e2e (green-skips before W4 lands)
        run: |
          if node -e "process.exit(require('./package.json').scripts && require('./package.json').scripts.e2e ? 0 : 1)"; then
            pnpm e2e
          else
            echo "::notice::pnpm e2e is not defined yet (lands with W4 — apps/web + Playwright + fake-model gateway). Green-skipping per docs/TESTING.md §7 / plan.json W0-09."
          fi
