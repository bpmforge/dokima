# Dokima nightly E2E — docs/TESTING.md §7 (Playwright over the Canvas,
# fake-model gateway only; never a real provider/forge).
#
# P0-05 (2026-08-31): this job green-skipped from W4 until now — it gated on a
# root `scripts.e2e` that was never defined (the real command lives behind
# --filter). The only scheduled job in the repo had never run its payload:
# "a check nobody runs decays into a check nobody can trust." It now runs the
# real suite and fails loud.
name: Nightly E2E

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  GIT_AUTHOR_NAME: dokima-ci
  GIT_AUTHOR_EMAIL: ci@dokima.invalid
  GIT_COMMITTER_NAME: dokima-ci
  GIT_COMMITTER_EMAIL: ci@dokima.invalid

jobs:
  e2e:
    name: e2e (fake-model gateway, TESTING.md §7)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.11.0'
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Enable the SC-07 process sandbox on the runner
        # Ubuntu 24.04 images ship kernel.apparmor_restrict_unprivileged_userns=1,
        # so `unshare --net -r` fails and every build run REFUSES (exit 2) —
        # exactly what SC-07 requires on a host that cannot sandbox (W13-25).
        # Lift the restriction, then prove the probe passes, so a runner-image
        # change fails HERE by name instead of as nineteen opaque test failures.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --net -r -- true && echo "SC-07 process sandbox available"
      - name: Install ripgrep (code-index tests use the real binary)
        run: sudo apt-get install -y -q ripgrep >/dev/null && rg --version | head -1
      - name: Install Playwright chromium
        run: pnpm --filter @dokima/web exec playwright install --with-deps chromium
      - name: Run e2e (builds web, boots server via playwright webServer)
        run: pnpm --filter @dokima/web e2e
      - name: Upload playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
