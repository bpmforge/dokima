# Written clean-room for Dokima; not derived from any other rule collection.
rules:
  - id: js-hardcoded-credential
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A password, secret, token or API key is written into the source as a
      string literal. Anyone with the code has it, and rotating it means a
      release. Read it from the environment or a secret store.
    metadata:
      category: security
      cwe: 'CWE-798: Use of Hard-coded Credentials'
      confidence: MEDIUM
    # Test files hold made-up credentials on purpose (a fake key to assert a
    # redaction, a stub provider's token); the product code is what ships.
    paths:
      exclude:
        - '*.test.*'
        - '*.spec.*'
        - '*_test.py'
        - 'test_*.py'
        - '**/test/**'
        - '**/tests/**'
        - '**/__tests__/**'
        - '**/e2e/**'
        - '**/fixtures/**'
        - '*-fixtures.*'
        - '*.fixture.*'
    patterns:
      - pattern-either:
          - pattern: $NAME = "$VALUE"
          - pattern: 'const $NAME = "$VALUE"'
          - pattern: 'let $NAME = "$VALUE"'
          - pattern: 'var $NAME = "$VALUE"'
          - pattern: '{..., $NAME: "$VALUE", ...}'
          - pattern: $OBJ.$NAME = "$VALUE"
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)^["']?[a-z0-9_]*(password|passwd|secret|api_?key|apikey|access_?token|auth_?token|private_?key|client_?secret)["']?$
      # Long enough to be a credential, one token, not an env-var name, not a
      # placeholder a reader is meant to replace.
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^\S{8,}$
      - metavariable-regex:
          metavariable: $VALUE
          regex: (?i)^(?![A-Z0-9_]+$)(?!.*(example|placeholder|changeme|change-me|dummy|redacted|not[-_ ]?needed|unused|fake|mock|sample|your[_-]|xxxx|\*\*\*|<|\$\{|\{\{|process\.env))
    options:
      # A shorthand property ({ dbPassword }) would otherwise be reported again
      # wherever the constant is re-exported.
      constant_propagation: false
      symbolic_propagation: false
