# Written clean-room for Dokima; not derived from any other rule collection.
rules:
  - id: js-tls-verification-disabled
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      TLS certificate verification is turned off, so any machine on the path
      can impersonate the server. Trust the right CA (the `ca` option or
      NODE_EXTRA_CA_CERTS) instead.
    metadata:
      category: security
      cwe: 'CWE-295: Improper Certificate Validation'
      confidence: HIGH
    pattern-either:
      - pattern: '{..., rejectUnauthorized: false, ...}'
      - pattern: $X.rejectUnauthorized = false
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
      - pattern: process.env["NODE_TLS_REJECT_UNAUTHORIZED"] = "0"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = 0
