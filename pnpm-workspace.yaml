packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  better-sqlite3: true
  esbuild: true
minimumReleaseAgeExclude:
  - '@eslint/eslintrc@3.3.6'
  - '@eslint/js@9.39.5'
  - eslint@9.39.5

# SC-16 supply chain: patched transitives for three high advisories that
# fastify@5.10.0 (already latest) pins beneath itself. These are patch-level
# bumps, not major upgrades. Scoped PER MAJOR because two fast-uri lines are
# genuinely in use — 3.x under @fastify/ajv-compiler>ajv, 4.x under
# @fastify/fast-json-stringify — and a blanket override would drag ajv onto
# 4.x. Remove an entry once fastify's own tree ships the fix.
#   fast-uri  <=3.1.3 / <=4.1.0  host confusion   (GHSA)
#   find-my-way <=9.6.0          HTTP/2 DDoS      (GHSA-c96f-x56v-gq3h)
overrides:
  fast-uri@3: '>=3.1.4 <4'   # bounded: an open '>=3.1.4' lets ajv resolve to 4.1.0, still vulnerable
  fast-uri@4: '>=4.1.1'
  find-my-way: '>=9.6.1'
